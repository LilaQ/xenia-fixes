# Shift 2 Unleashed, default.xex hash C4CD9F33611C5AFD, media 739C7DC0.
# D3D12 accuracy baseline: correct car shadows, with owner-observed performance cost.
[GPU]
gpu = "d3d12"
render_target_path = "accuracy"
readback_resolve = false
occlusion_query = "fast"
framerate_limit = 60
guest_display_refresh_cap = true
draw_resolution_scale_x = 1
draw_resolution_scale_y = 1

[General]
apply_patches = true
time_scalar = 1

[Display]
fullscreen = true

[HID]
hid = "sdl"

[UI]
show_achievement_notification = true
